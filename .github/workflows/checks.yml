name: Rust checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Build the library for bare WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --locked --lib --target wasm32-unknown-unknown
      - name: Verify the package and dependency contract
        run: |
          python3 - <<'PY'
          import json, subprocess
          metadata = json.loads(subprocess.check_output(["cargo", "metadata", "--locked", "--format-version", "1", "--no-deps"]))
          assert len(metadata["packages"]) == 1 and not metadata["packages"][0]["dependencies"]
          PY
          cargo package --locked
      - name: Check the library on 16-bit MSP430
        run: |
          rustup toolchain install nightly-2026-10-31 --profile minimal --component rust-src
          cargo +nightly-2026-10-31 check --locked -Z build-std=core --target msp430-none-elf --lib
